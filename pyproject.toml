[project]
name = "gadgetbridge_pipeline"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "connectorx>=0.4.5",
    "pyarrow>=18",
    "dagster==1.13.31",
    "dagster-aws>=0.29.8",
    "dagster-delta[polars]>=0.5.9",
    "dagster-k8s>=0.29.8",
    "dagster-openlineage>=0.2.1",
    "dagster-postgres>=0.29.8",
    "polars>=1.41.2",
    "pandera[polars]>=0.32.0",
    "dagster-apprise>=0.0.3",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli>=1.13.10",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.18",
    "marimo>=0.23.14",
    "altair>=6.2.2",
    "mutmut>=3.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.pytest.ini_options]
addopts = "--cov=gadgetbridge_pipeline --cov-report=term-missing"

[tool.mutmut]
# Mutation testing: `uv run mutmut run`, then `uv run mutmut browse` / `mutmut results`.
# Only modules with real logic are mutated; the Dagster wiring (resources, sensors,
# raw.py) mutates into noise.
source_paths = [
    "src/gadgetbridge_pipeline/defs/s3_watch.py",
    "src/gadgetbridge_pipeline/defs/gadgetbridge/bronze.py",
    "src/gadgetbridge_pipeline/defs/gadgetbridge/silver.py",
    "src/gadgetbridge_pipeline/defs/gadgetbridge/gold.py",
    "src/gadgetbridge_pipeline/defs/gadgetbridge/sleep_session.py",
    "src/gadgetbridge_pipeline/defs/owntracks/bronze.py",
    "src/gadgetbridge_pipeline/defs/owntracks/silver.py",
    "src/gadgetbridge_pipeline/defs/poi/bronze.py",
    "src/gadgetbridge_pipeline/defs/medicine/bronze.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
# the rest of the package, so unmutated imports (resources.py etc.) resolve
also_copy = ["src/gadgetbridge_pipeline"]
# polars runs its own thread pool and is not fork-safe: forking after it has been
# used can hang or crash a worker (and each crash dumped a ~500MB core file).
# "forkserver" forks workers from a clean server process, and warmup "none" stops
# that server importing the test modules (and so polars) before it forks.
process_isolation = "forkserver"
forkserver_warmup = "none"
# With warmup "none" every worker cold-starts pytest, dagster and polars (~8s). The
# default per-mutant wall limit is (est_test_time + 1) * 15 = ~16s, so under any load
# fast mutants were misreported as timeouts, hiding real survivors. This raises it to
# ~60s; genuine infinite loops (e.g. in build_medicine_log) still hit it.
timeout_constant = 4.0
# addopts enables coverage, which slows every mutant run for no benefit.
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]

[tool.coverage.run]
source = ["src/gadgetbridge_pipeline"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "gadgetbridge_pipeline"
registry_modules = [
    "gadgetbridge_pipeline.components.*",
]

[tool.ruff]
exclude = ["*.nb.py"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (ruff's previous default)
    "I",    # isort — import sorting/grouping
    "UP",   # pyupgrade — modern Python syntax
    "B",    # flake8-bugbear — common bug-prone patterns
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
